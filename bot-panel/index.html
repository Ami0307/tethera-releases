<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tethera 面板</title>
<!-- Telegram Mini App 的官方脚本。页面本身不含任何数据：当前状态由机器人放在网址 # 后面（不会发到服务器），
     点「保存」后由 Telegram 把选择作为私聊消息交回机器人，机器人核对是不是维护者本人再改。 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  p.hint { color: var(--hint); font-size: 14px; margin: 0 0 16px; }
  .group { background: var(--card); border-radius: 12px; padding: 4px 0; margin-bottom: 16px; }
  .group h2 { font-size: 13px; font-weight: 600; color: var(--hint); margin: 10px 16px 4px; }
  label.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  label.row + label.row { border-top: 1px solid rgba(127,127,127,.15); }
  label.row input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
  .name { flex: 1; }
  .state { font-size: 13px; color: var(--hint); text-align: right; max-width: 55%; }
  .state.bad { color: #e5484d; }
  .fixed { padding: 12px 16px; display: flex; justify-content: space-between; }
  #outside { display: none; color: var(--hint); }
</style>
</head>
<body>
<h1>🤖 写代码先用哪个 agent</h1>
<p class="hint">选中的那个用不了时，会自动换另一个。审查固定用 Codex。</p>

<div class="group">
  <h2>先用</h2>
  <label class="row"><input type="radio" name="first" value="agy"><span class="name">反重力</span><span class="state" id="s-agy"></span></label>
  <label class="row"><input type="radio" name="first" value="claude"><span class="name">Claude Code</span><span class="state" id="s-claude"></span></label>
</div>

<div class="group">
  <h2>审查</h2>
  <div class="fixed"><span>Codex</span><span class="state" id="s-codex"></span></div>
</div>

<div class="group">
  <label class="row"><input type="checkbox" id="clear"><span class="name">清掉反重力、Codex 的额度冷却</span></label>
</div>

<p id="outside">请从 Telegram 里机器人的「打开面板」按钮进来。</p>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var state = {};
  try { state = JSON.parse(decodeURIComponent(location.hash.slice(1)) || "{}"); } catch (e) { state = {}; }
  var order = Array.isArray(state.order) && state.order.length ? state.order : ["agy", "claude"];
  var first = document.querySelector('input[name=first][value="' + order[0] + '"]');
  if (first) first.checked = true;
  function show(id, text) {
    var el = document.getElementById(id);
    el.textContent = text ? "⏸ " + text : "可用";
    if (text) el.classList.add("bad");
  }
  show("s-agy", state.agy);
  show("s-claude", state.claude);
  show("s-codex", state.codex);

  var initial = order[0];
  function payload() {
    var picked = document.querySelector("input[name=first]:checked");
    return { first: picked ? picked.value : initial, clear: document.getElementById("clear").checked };
  }
  function changed() {
    var p = payload();
    return p.first !== initial || p.clear;
  }
  function send() { tg.sendData(JSON.stringify(payload())); }

  // 从输入框下的按钮打开时 Telegram 不给 initData（这种方式只能 sendData），所以按平台判断是不是在 Telegram 里
  if (!tg || !tg.platform || tg.platform === "unknown") {
    document.getElementById("outside").style.display = "block";
    return;
  }
  tg.ready();
  tg.expand();
  tg.MainButton.setText("保存");
  tg.MainButton.onClick(send);
  function refresh() { changed() ? tg.MainButton.show() : tg.MainButton.hide(); }
  document.querySelectorAll("input").forEach(function (i) { i.addEventListener("change", refresh); });
  refresh();
})();
</script>
</body>
</html>
